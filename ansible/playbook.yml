---
- name: Installer le serveur de demonstration
  hosts: web
  become: true
  tasks:
    - name: Installer Nginx et UFW
      ansible.builtin.apt:
        name: [nginx, ufw]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Creer le compte applicatif sans connexion
      ansible.builtin.user:
        name: meditrack
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present
    - name: Autoriser SSH depuis la seule IP administrateur
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ admin_ip }}"
    - name: Autoriser HTTP du serveur de demonstration
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp
    - name: Bloquer les autres connexions entrantes
      community.general.ufw:
        direction: incoming
        policy: deny
    - name: Activer le pare feu
      community.general.ufw:
        state: enabled
    - name: Deployer les fichiers statiques
      ansible.builtin.copy:
        src: ../site/
        dest: /var/www/html/
        owner: root
        group: root
        mode: preserve
      notify: Recharger Nginx
    - name: Activer Nginx
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started
  handlers:
    - name: Recharger Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
